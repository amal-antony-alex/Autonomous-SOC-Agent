services:

  postgres:
    image: postgres:16
    container_name: socagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: socagent
      POSTGRES_PASSWORD: socagent
      POSTGRES_DB: socagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
